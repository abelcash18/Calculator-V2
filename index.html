<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator | Web App</title>
    <link rel="icon" href="icon-1.png" type="image/png">
    <link rel="stylesheet" href="cal.css">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-1.png">
    <link rel="apple-touch-startup-image" href="splashscreen.jpg">
</head>
<body>
    <button id="installBtn" class="installBtn is-hidden">Install App</button>

    <div class="sideNav">
        <div>
            <h4>Calculator</h4>
            <ul>
                <li>Standard</li>
                <li>Scientific</li>
                <li>Quick math</li>
            </ul>
        </div>
        <div>
            <h4>Tools</h4>
            <ul>
                <li>Trig</li>
                <li>Logarithms</li>
                <li>Constants</li>
            </ul>
        </div>
    </div>

    <div class="app-shell">
        <div class="calculator-card">
            <div class="card-header">
                <div class="title-group">
                    <div class="brand-dot"></div>
                    <div>
                        <p class="eyebrow">Smart</p>
                        <h1>Calculator</h1>
                    </div>
                </div>
                <div class="header-actions">
                    <button id="showMenu" class="ghost-btn" aria-label="Toggle menu">☰</button>
                    <button id="toggleScience" class="ghost-btn">Sci</button>
                    <button id="themeToggle" class="ghost-btn" aria-label="Toggle theme">☀</button>
                </div>
            </div>

            <div class="display-area">
                <label class="sr-only" for="displayy">Expression</label>
                <div id="displayy" class="expression-display" aria-live="polite"></div>
                <label class="sr-only" for="display">Current value</label>
                <input id="display" class="main-display" type="text" inputmode="decimal" readonly>
            </div>

            <div class="mode-row">
                <button id="modeToggle" class="mode-pill">Deg</button>
                <span class="mode-label">Angle mode</span>
            </div>

            <div id="keypad" class="keypad">
                <button class="key action" data-action="clear-all">AC</button>
                <button class="key action" data-action="delete">⌫</button>
                <button class="key action" data-action="clear-entry">CE</button>
                <button class="key operator" data-value="/">÷</button>

                <button class="key number" data-value="7">7</button>
                <button class="key number" data-value="8">8</button>
                <button class="key number" data-value="9">9</button>
                <button class="key operator" data-value="*">×</button>

                <button class="key number" data-value="4">4</button>
                <button class="key number" data-value="5">5</button>
                <button class="key number" data-value="6">6</button>
                <button class="key operator" data-value="-">−</button>

                <button class="key number" data-value="1">1</button>
                <button class="key number" data-value="2">2</button>
                <button class="key number" data-value="3">3</button>
                <button class="key operator" data-value="+">+</button>

                <button class="key number" data-value="0">0</button>
                <button class="key number" data-value=".">.</button>
                <button class="key action" data-action="parenthesis">()</button>
                <button class="key operator equals" data-action="equals">=</button>
            </div>

            <div id="scientificPad" class="scientific-pad hidden">
                <button class="key sci" data-action="square">x²</button>
                <button class="key sci" data-action="power">xʸ</button>
                <button class="key sci" data-action="sqrt">√</button>
                <button class="key sci" data-action="pow10">10ˣ</button>
                <button class="key sci" data-action="factorial">x!</button>

                <button class="key sci" data-action="sin">sin</button>
                <button class="key sci" data-action="cos">cos</button>
                <button class="key sci" data-action="tan">tan</button>
                <button class="key sci" data-action="log">log</button>
                <button class="key sci" data-action="ln">ln</button>

                <button class="key sci" data-action="exp">exp</button>
                <button class="key sci" data-action="pi">π</button>
                <button class="key sci" data-action="e">e</button>
                <button class="key sci" data-action="negate">±</button>
                <button class="key sci" data-action="percent">%</button>
            </div>
        </div>
    </div>

    <footer class="cute-footer">
        <p>© 2026 AbelTech Solutions</p>
    </footer>

    <script src="cal.js"></script>
</body>
</html>
